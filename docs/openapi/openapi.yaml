openapi: 3.0.3
info:
  title: Alicerce API
  version: "1"
  description: >
    Written first (ADR 0011): every response in spec/requests/api/v1 is
    validated against this document by committee, and
    frontend/src/api/schema.d.ts is generated from it.
servers:
  - url: /api/v1

paths:
  /session:
    get:
      operationId: getSession
      summary: Current session and CSRF token
      description: >
        Always answers 200, signed in or not, so the SPA can fetch a CSRF
        token before the first sign-in attempt.
      responses:
        "200":
          $ref: "#/components/responses/SessionResponse"
    post:
      operationId: createSession
      summary: Sign in
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      operationId: destroySession
      summary: Sign out
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          $ref: "#/components/responses/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /session/organization:
    post:
      operationId: switchSessionOrganization
      summary: Switch the active organization, rotating the session
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /audit_events:
    get:
      operationId: listAuditEvents
      summary: List the current organization's audit trail
      description: Owner and admin only (ADR 0008).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          $ref: "#/components/responses/AuditEventListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /units:
    get:
      operationId: listUnits
      summary: List the current organization's units of measure
      description: Every role can read (ADR 0008); owner, admin and purchasing can also write.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          $ref: "#/components/responses/UnitListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      operationId: createUnit
      summary: Create a unit of measure
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitRequest"
      responses:
        "201":
          $ref: "#/components/responses/UnitResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /units/{id}:
    get:
      operationId: showUnit
      summary: Show a unit of measure
      description: Every role can read (ADR 0008).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          $ref: "#/components/responses/UnitResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUnit
      summary: Update a unit of measure
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUnitRequest"
      responses:
        "200":
          $ref: "#/components/responses/UnitResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /categories:
    get:
      operationId: listCategories
      summary: List the current organization's product categories
      description: Every role can read (ADR 0008); owner, admin and purchasing can also write.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          $ref: "#/components/responses/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      operationId: createCategory
      summary: Create a product category
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          $ref: "#/components/responses/CategoryResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /categories/{id}:
    get:
      operationId: showCategory
      summary: Show a product category
      description: Every role can read (ADR 0008).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          $ref: "#/components/responses/CategoryResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCategory
      summary: Update a product category
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          $ref: "#/components/responses/CategoryResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /products:
    get:
      operationId: listProducts
      summary: List the current organization's products
      description: Every role can read (ADR 0008); owner, admin and purchasing can also write.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: active
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Case-insensitive search over name and sku.
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/ProductListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      operationId: createProduct
      summary: Create a product
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          $ref: "#/components/responses/ProductResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /products/{id}:
    get:
      operationId: showProduct
      summary: Show a product
      description: Every role can read (ADR 0008).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          $ref: "#/components/responses/ProductResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProduct
      summary: Update a product
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          $ref: "#/components/responses/ProductResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /warehouses:
    get:
      operationId: listWarehouses
      summary: List the current organization's warehouses
      description: Every role can read (ADR 0008); owner, admin and purchasing can also write.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          $ref: "#/components/responses/WarehouseListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      operationId: createWarehouse
      summary: Create a warehouse
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarehouseRequest"
      responses:
        "201":
          $ref: "#/components/responses/WarehouseResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /warehouses/{id}:
    get:
      operationId: showWarehouse
      summary: Show a warehouse
      description: Every role can read (ADR 0008).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          $ref: "#/components/responses/WarehouseResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateWarehouse
      summary: Update a warehouse
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWarehouseRequest"
      responses:
        "200":
          $ref: "#/components/responses/WarehouseResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /stock_balances:
    get:
      operationId: listStockBalances
      summary: List the stock position, one row per product and warehouse
      description: Every role can read (ADR 0016).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: warehouse_id
          in: query
          schema: { type: integer }
        - name: product_id
          in: query
          schema: { type: integer }
        - name: q
          in: query
          description: Searches the product's name and sku.
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/StockBalanceListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /stock_movements:
    get:
      operationId: listStockMovements
      summary: List the movement ledger, newest first
      description: Every role but sales can read (ADR 0016); sales sees balances only.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: warehouse_id
          in: query
          schema: { type: integer }
        - name: product_id
          in: query
          schema: { type: integer }
        - name: reason
          in: query
          schema: { $ref: "#/components/schemas/AdjustmentReason" }
      responses:
        "200":
          $ref: "#/components/responses/StockMovementListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /stock_adjustments:
    post:
      operationId: createStockAdjustment
      summary: Record a count adjustment
      description: >
        Sets the stock of a product in a warehouse to the counted quantity and
        records the difference as one ledger movement (ADR 0016). Owner, admin
        and purchasing only (ADR 0008). A count equal to the balance writes no
        movement and answers 200 with a null movement. The reason must agree with
        the direction: loss, damage, theft and expiry decrease stock; found and
        opening_balance increase it, and opening_balance only for a balance with
        no history.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentRequest"
      responses:
        "200":
          $ref: "#/components/responses/StockAdjustmentResponse"
        "201":
          $ref: "#/components/responses/StockAdjustmentResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /purchase_orders:
    get:
      operationId: listPurchaseOrders
      summary: List purchase orders, newest number first
      description: Owner, admin, purchasing, finance and read_only can read; sales has no access (ADR 0017, ADR 0008).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PurchaseOrderStatus" }
        - name: supplier_id
          in: query
          schema: { type: integer }
        - name: q
          in: query
          description: Matches the order number or the supplier's name.
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/PurchaseOrderListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      operationId: createPurchaseOrder
      summary: Create a draft purchase order
      description: >
        Owner, admin and purchasing only. Copies the supplier and each product as
        they are now (ADR 0015), works out every line's amounts and the order's
        total, and numbers the order. Amounts are stored; a client never computes
        them.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderRequest"
      responses:
        "201":
          $ref: "#/components/responses/PurchaseOrderResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /purchase_orders/{id}:
    get:
      operationId: showPurchaseOrder
      summary: Show a purchase order with its lines
      description: The supplier's CPF is masked for a role that may not see a partner's in full (ADR 0014).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          $ref: "#/components/responses/PurchaseOrderResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePurchaseOrder
      summary: Replace a draft purchase order's supplier, terms, note and lines
      description: >
        Owner, admin and purchasing only, and only while the order is a draft. Send
        the revision that was read; a newer one on the server answers 409 stale and
        writes nothing (ADR 0015).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePurchaseOrderRequest"
      responses:
        "200":
          $ref: "#/components/responses/PurchaseOrderResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /purchase_orders/{id}/approval:
    post:
      operationId: approvePurchaseOrder
      summary: Approve a draft purchase order
      description: >
        Owner, admin and purchasing only. The approver sends the revision they saw,
        so an edit made in between answers 409 stale instead of being approved
        unseen. Approval checks the order can be received and freezes what it copies.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderRevisionRequest"
      responses:
        "200":
          $ref: "#/components/responses/PurchaseOrderResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /purchase_orders/{id}/cancellation:
    post:
      operationId: cancelPurchaseOrder
      summary: Cancel a purchase order
      description: >
        Owner, admin and purchasing only. A draft or approved order ends; a partially
        received one is closed at what has been received. A received or cancelled
        order answers 409 invalid_transition.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          $ref: "#/components/responses/PurchaseOrderResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /partners:
    get:
      operationId: listPartners
      summary: List the current organization's partners
      description: Every role can read (ADR 0008); owner, admin and purchasing can also write.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: customer
          in: query
          schema: { type: boolean }
        - name: supplier
          in: query
          schema: { type: boolean }
        - name: active
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Case-insensitive search over name.
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/PartnerListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      operationId: createPartner
      summary: Create a partner
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartnerRequest"
      responses:
        "201":
          $ref: "#/components/responses/PartnerResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /partners/{id}:
    get:
      operationId: showPartner
      summary: Show a partner
      description: Every role can read (ADR 0008).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          $ref: "#/components/responses/PartnerResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePartner
      summary: Update a partner
      description: Owner, admin and purchasing only (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartnerRequest"
      responses:
        "200":
          $ref: "#/components/responses/PartnerResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /invitations:
    get:
      operationId: listInvitations
      summary: List the current organization's pending invitations
      description: Owner and admin only; denied to demo users regardless of role (ADR 0008).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          $ref: "#/components/responses/PendingInvitationListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvitation
      summary: Invite someone to join the organization
      description: Owner and admin only; denied to demo users regardless of role (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          $ref: "#/components/responses/InvitationResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /invitations/acceptance:
    post:
      operationId: acceptInvitation
      summary: Accept a pending invitation
      description: >
        No session required (ADR 0003): holding the token is the only
        credential this action recognizes. The token travels in the body,
        never the URL, so it cannot leak through request path logging.
        Signs the accepting user in on success, the same as POST /session.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionResponse"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /invitations/{id}:
    delete:
      operationId: destroyInvitation
      summary: Cancel a pending invitation
      description: Owner and admin only; denied to demo users regardless of role (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: The invitation was cancelled.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /memberships:
    get:
      operationId: listMemberships
      summary: List the current organization's members
      description: Owner and admin only; denied to demo users regardless of role (ADR 0008).
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          $ref: "#/components/responses/MemberListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /memberships/{id}:
    patch:
      operationId: updateMembership
      summary: Change a member's role
      description: Owner and admin only; denied to demo users regardless of role (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRequest"
      responses:
        "200":
          $ref: "#/components/responses/MemberResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: destroyMembership
      summary: Remove a member from the organization
      description: Owner and admin only; denied to demo users regardless of role (ADR 0008).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: The member was removed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /password_resets:
    post:
      operationId: createPasswordReset
      summary: Request a password reset email
      description: >
        Always answers 204 whether or not the email belongs to an account
        or a demo one (ADR 0007: uniform response); a real, non-demo
        account receives an email with a single-use link that expires in
        20 minutes.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePasswordResetRequest"
      responses:
        "204":
          description: The request was accepted.
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /password_resets/completion:
    post:
      operationId: completePasswordReset
      summary: Complete a password reset with its token
      description: >
        No session is started (ADR 0007): sign in afterwards with the new
        password. The token travels in the body, never the URL, so it
        cannot leak through request path logging; it stops working after
        this succeeds, since it is bound to the password salt it just
        changed.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePasswordResetRequest"
      responses:
        "204":
          description: The password was reset.
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /password:
    patch:
      operationId: updatePassword
      summary: Change the signed-in user's own password
      description: >
        Requires the current password; denied to demo users (ADR 0008: an
        authentication setting). Revokes every other session of the
        caller, in every organization (ADR 0007), leaving this one alive.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

components:
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The csrf_token from the most recent GET or POST /session response.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        A client-generated key of 8 to 100 characters (letters, digits and
        . _ : -), one per user intent (ADR 0005). Repeating a request with the
        same key and the same body replays its result without a second effect;
        the same key with another body is a 422 idempotency_key_reused. Only
        successes are remembered, so a failed attempt can be retried.
      schema:
        type: string
        minLength: 8
        maxLength: 100

  responses:
    SessionResponse:
      description: The current session, if any, and a CSRF token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionResponseBody"
    Error:
      description: An error in the shared envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponseBody"
    AuditEventListResponse:
      description: A page of the audit trail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuditEventListResponseBody"
    InvitationResponse:
      description: A newly issued invitation, with its one-time token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvitationResponseBody"
    MemberResponse:
      description: A member of the current organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemberResponseBody"
    MemberListResponse:
      description: A page of the current organization's members.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemberListResponseBody"
    PendingInvitationListResponse:
      description: A page of the current organization's pending invitations.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PendingInvitationListResponseBody"
    UnitResponse:
      description: A unit of measure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnitResponseBody"
    UnitListResponse:
      description: A page of the current organization's units of measure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnitListResponseBody"
    CategoryResponse:
      description: A product category.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CategoryResponseBody"
    CategoryListResponse:
      description: A page of the current organization's product categories.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CategoryListResponseBody"
    ProductResponse:
      description: A product.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProductResponseBody"
    ProductListResponse:
      description: A page of the current organization's products.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProductListResponseBody"
    WarehouseResponse:
      description: A warehouse.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WarehouseResponseBody"
    WarehouseListResponse:
      description: A page of the current organization's warehouses.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WarehouseListResponseBody"
    StockBalanceListResponse:
      description: A page of the stock position.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StockBalanceListResponseBody"
    StockMovementListResponse:
      description: A page of the movement ledger, newest first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StockMovementListResponseBody"
    StockAdjustmentResponse:
      description: The movement that was written, or null when the count matched, and the balance after it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StockAdjustmentResponseBody"
    PurchaseOrderResponse:
      description: A purchase order with its lines.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PurchaseOrderResponseBody"
    PurchaseOrderListResponse:
      description: A page of purchase orders.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PurchaseOrderListResponseBody"
    PartnerResponse:
      description: A partner.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PartnerResponseBody"
    PartnerListResponse:
      description: A page of the current organization's partners.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PartnerListResponseBody"

  schemas:
    User:
      type: object
      additionalProperties: false
      required: [ id, name, email, demo ]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        demo: { type: boolean }

    Organization:
      type: object
      additionalProperties: false
      required: [ id, name, time_zone, demo ]
      properties:
        id: { type: integer }
        name: { type: string }
        time_zone: { type: string }
        demo: { type: boolean }

    Membership:
      type: object
      additionalProperties: false
      required: [ role, organization ]
      properties:
        role:
          type: string
          enum: [ owner, admin, purchasing, sales, finance, read_only ]
        organization:
          $ref: "#/components/schemas/Organization"

    SessionData:
      type: object
      additionalProperties: false
      required: [ csrf_token, user, membership, memberships ]
      properties:
        csrf_token: { type: string }
        user:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/User" } ]
        membership:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/Membership" } ]
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }

    SessionResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          $ref: "#/components/schemas/SessionData"

    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [ email, password ]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        organization_id:
          type: integer
          description: Required only when the account belongs to more than one organization.

    SwitchOrganizationRequest:
      type: object
      additionalProperties: false
      required: [ organization_id ]
      properties:
        organization_id: { type: integer }

    Error:
      type: object
      additionalProperties: false
      required: [ code, message, details, request_id ]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
          nullable: true

    ErrorResponseBody:
      type: object
      additionalProperties: false
      required: [ error ]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    Meta:
      type: object
      additionalProperties: false
      required: [ page, per_page, total ]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    AuditEvent:
      type: object
      additionalProperties: false
      required: [ id, action, subject_type, subject_id, field_changes, actor, created_at ]
      properties:
        id: { type: integer }
        action: { type: string }
        subject_type: { type: string }
        subject_id: { type: integer }
        field_changes:
          type: object
          additionalProperties: true
        actor:
          $ref: "#/components/schemas/User"
        created_at:
          type: string
          format: date-time

    AuditEventListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        meta:
          $ref: "#/components/schemas/Meta"

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [ email, role ]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [ owner, admin, purchasing, sales, finance, read_only ]

    Invitation:
      type: object
      additionalProperties: false
      required: [ id, email, role, expires_at, token ]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role:
          type: string
          enum: [ owner, admin, purchasing, sales, finance, read_only ]
        expires_at: { type: string, format: date-time }
        token:
          type: string
          description: The raw invitation token. Shown only in this response; only its digest is stored.

    InvitationResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          $ref: "#/components/schemas/Invitation"

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [ token ]
      properties:
        token: { type: string }
        name:
          type: string
          description: Required when the invited email has no account yet.
        password:
          type: string
          description: Required when the invited email has no account yet.

    UpdateMembershipRequest:
      type: object
      additionalProperties: false
      required: [ role ]
      properties:
        role:
          type: string
          enum: [ owner, admin, purchasing, sales, finance, read_only ]

    Member:
      type: object
      additionalProperties: false
      required: [ id, user, role ]
      properties:
        id: { type: integer }
        user:
          $ref: "#/components/schemas/User"
        role:
          type: string
          enum: [ owner, admin, purchasing, sales, finance, read_only ]

    MemberResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          $ref: "#/components/schemas/Member"

    MemberListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        meta:
          $ref: "#/components/schemas/Meta"

    PendingInvitation:
      type: object
      additionalProperties: false
      required: [ id, email, role, invited_by, expires_at ]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role:
          type: string
          enum: [ owner, admin, purchasing, sales, finance, read_only ]
        invited_by:
          $ref: "#/components/schemas/User"
        expires_at: { type: string, format: date-time }

    PendingInvitationListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PendingInvitation" }
        meta:
          $ref: "#/components/schemas/Meta"

    CreatePasswordResetRequest:
      type: object
      additionalProperties: false
      required: [ email ]
      properties:
        email: { type: string, format: email }

    CompletePasswordResetRequest:
      type: object
      additionalProperties: false
      required: [ token, password ]
      properties:
        token: { type: string }
        password: { type: string }

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [ current_password, password ]
      properties:
        current_password: { type: string }
        password: { type: string }

    Unit:
      type: object
      additionalProperties: false
      required: [ id, code, name, active ]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }

    UnitResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          $ref: "#/components/schemas/Unit"

    UnitListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Unit" }
        meta:
          $ref: "#/components/schemas/Meta"

    CreateUnitRequest:
      type: object
      additionalProperties: false
      required: [ code, name ]
      properties:
        code: { type: string }
        name: { type: string }

    UpdateUnitRequest:
      type: object
      additionalProperties: false
      required: [ code, name, active ]
      properties:
        code: { type: string }
        name: { type: string }
        active: { type: boolean }

    Category:
      type: object
      additionalProperties: false
      required: [ id, name, active ]
      properties:
        id: { type: integer }
        name: { type: string }
        active: { type: boolean }

    CategoryResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          $ref: "#/components/schemas/Category"

    CategoryListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        meta:
          $ref: "#/components/schemas/Meta"

    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name: { type: string }

    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required: [ name, active ]
      properties:
        name: { type: string }
        active: { type: boolean }

    UnitConversion:
      type: object
      additionalProperties: false
      required: [ purchase_unit, factor ]
      properties:
        purchase_unit:
          $ref: "#/components/schemas/Unit"
        factor:
          type: string
          pattern: '^[0-9]{1,9}\.[0-9]{6}$'
          description: Decimal string, always 6 places (ADR 0006). Stock quantity = purchase quantity x factor.

    Product:
      type: object
      additionalProperties: false
      required: [ id, sku, name, active, revision, category, stock_unit, unit_conversion ]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        active: { type: boolean }
        revision:
          type: integer
          description: >
            Counts the successful edits of this record (ADR 0015). Send back
            the value that was read; if the record changed since, the answer
            is 409 stale and nothing is written.
        category:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/Category" } ]
        stock_unit:
          $ref: "#/components/schemas/Unit"
        unit_conversion:
          $ref: "#/components/schemas/UnitConversion"

    ProductResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          $ref: "#/components/schemas/Product"

    ProductListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        meta:
          $ref: "#/components/schemas/Meta"

    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [ sku, name, stock_unit_id, purchase_unit_id, factor ]
      properties:
        sku: { type: string }
        name: { type: string }
        category_id:
          type: integer
          nullable: true
        stock_unit_id: { type: integer }
        purchase_unit_id: { type: integer }
        factor:
          type: string
          description: Decimal string, greater than zero, below 1000000000, at most 6 places (ADR 0006). More places or a larger value is a validation_failed (too_many_decimals, less_than), never a rounding.

    UpdateProductRequest:
      type: object
      additionalProperties: false
      required: [ sku, name, stock_unit_id, purchase_unit_id, factor, active, revision ]
      properties:
        sku: { type: string }
        name: { type: string }
        category_id:
          type: integer
          nullable: true
        stock_unit_id:
          type: integer
          description: Must equal the product's current stock unit. A different one is a validation_failed with the kind immutable on stock_unit (ADR 0015).
        purchase_unit_id: { type: integer }
        factor:
          type: string
          description: Decimal string, greater than zero, below 1000000000, at most 6 places (ADR 0006). More places or a larger value is a validation_failed (too_many_decimals, less_than), never a rounding.
        active: { type: boolean }
        revision:
          type: integer
          description: The revision that was read; a newer one on the server answers 409 stale (ADR 0015).

    Warehouse:
      type: object
      additionalProperties: false
      required: [ id, name, active ]
      properties:
        id: { type: integer }
        name: { type: string }
        active: { type: boolean }

    WarehouseResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          $ref: "#/components/schemas/Warehouse"

    WarehouseListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Warehouse" }
        meta:
          $ref: "#/components/schemas/Meta"

    CreateWarehouseRequest:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name: { type: string }

    UpdateWarehouseRequest:
      type: object
      additionalProperties: false
      required: [ name, active ]
      properties:
        name: { type: string }
        active: { type: boolean }

    AdjustmentReason:
      type: string
      enum: [ opening_balance, count, loss, damage, theft, expiry, found, other ]

    ProductReference:
      type: object
      description: A product as a balance or a movement refers to it.
      additionalProperties: false
      required: [ id, sku, name, stock_unit ]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        stock_unit:
          $ref: "#/components/schemas/Unit"

    StockBalance:
      type: object
      additionalProperties: false
      required: [ id, product, warehouse, on_hand, reserved, available, value_cents, currency, last_unit_cost_cents ]
      properties:
        id: { type: integer }
        product:
          $ref: "#/components/schemas/ProductReference"
        warehouse:
          $ref: "#/components/schemas/Warehouse"
        on_hand:
          type: string
          pattern: '^-?[0-9]{1,12}\.[0-9]{3}$'
          description: Decimal string with 3 places, in the product's stock unit (ADR 0006).
        reserved:
          type: string
          pattern: '^[0-9]{1,12}\.[0-9]{3}$'
        available:
          type: string
          pattern: '^-?[0-9]{1,12}\.[0-9]{3}$'
          description: on_hand minus reserved, computed by the API.
        value_cents:
          type: integer
          nullable: true
          description: >
            The inventory value of on_hand, in cents (ADR 0006). Null for a role
            that may not see what stock is worth or cost (sales, ADR 0016).
        currency:
          type: string
          enum: [ BRL ]
        last_unit_cost_cents:
          type: string
          nullable: true
          pattern: '^[0-9]{1,13}\.[0-9]{6}$'
          description: >
            Cost per stock unit of the latest costed entry, in cents, always 6
            places. Null when value_cents is.

    StockMovement:
      type: object
      additionalProperties: false
      required: [ id, kind, reason, note, product, warehouse, quantity, value_cents, currency, on_hand_after, value_after_cents, actor, created_at ]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [ adjustment ]
        reason:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/AdjustmentReason" } ]
        note:
          type: string
          nullable: true
        product:
          $ref: "#/components/schemas/ProductReference"
        warehouse:
          $ref: "#/components/schemas/Warehouse"
        quantity:
          type: string
          pattern: '^-?[0-9]{1,12}\.[0-9]{3}$'
          description: Signed, and a negative quantity takes stock out.
        value_cents:
          type: integer
          description: Signed like quantity.
        currency:
          type: string
          enum: [ BRL ]
        on_hand_after:
          type: string
          pattern: '^-?[0-9]{1,12}\.[0-9]{3}$'
        value_after_cents: { type: integer }
        actor:
          type: object
          additionalProperties: false
          required: [ id, name ]
          properties:
            id: { type: integer }
            name: { type: string }
        created_at:
          type: string
          format: date-time

    StockBalanceListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/StockBalance" }
        meta:
          $ref: "#/components/schemas/Meta"

    StockMovementListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/StockMovement" }
        meta:
          $ref: "#/components/schemas/Meta"

    StockAdjustmentResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [ movement, balance ]
          properties:
            movement:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/StockMovement" } ]
            balance:
              $ref: "#/components/schemas/StockBalance"

    StockAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [ product_id, warehouse_id, counted_quantity, expected_on_hand, reason ]
      properties:
        product_id: { type: integer }
        warehouse_id: { type: integer }
        counted_quantity:
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,3})?$'
          description: >
            The quantity actually counted, in the product's stock unit, at most
            3 places. The API computes the difference from the balance under
            its lock; the client never does.
        expected_on_hand:
          type: string
          pattern: '^-?[0-9]{1,12}(\.[0-9]{1,3})?$'
          description: >
            The balance's on_hand as the client last saw it ("0.000" when it
            had no balance). A count is an observation at a moment: if a sale or
            a receipt moved the balance since, the count is refused with 409
            stale, and error details carry current_on_hand (ADR 0016).
        reason:
          $ref: "#/components/schemas/AdjustmentReason"
        note:
          type: string
          maxLength: 500
        unit_cost_cents:
          type: string
          pattern: '^[0-9]{1,13}(\.[0-9]{1,6})?$'
          description: >
            Cost per stock unit in cents (a decimal string, since a unit can
            cost a fraction of a cent), at most 6 places, for an increase.
            Required when the balance has no average or last cost to value it
            with (kind required on unit_cost_cents); not allowed for a
            decrease (ADR 0016).

    PurchaseOrderStatus:
      type: string
      enum: [ draft, approved, partially_received, received, cancelled ]

    PurchaseOrderSummary:
      type: object
      additionalProperties: false
      required: [ id, number, status, supplier, total_cents, currency, created_at ]
      properties:
        id: { type: integer }
        number: { type: integer }
        status:
          $ref: "#/components/schemas/PurchaseOrderStatus"
        supplier:
          type: object
          additionalProperties: false
          required: [ id, name ]
          properties:
            id: { type: integer }
            name: { type: string }
        total_cents: { type: integer }
        currency:
          type: string
          enum: [ BRL ]
        created_at:
          type: string
          format: date-time

    PurchaseOrderLine:
      type: object
      additionalProperties: false
      required: [ id, position, product, purchase_unit_code, stock_unit_code, factor, quantity, received_quantity, remaining_quantity, unit_price_cents, discount_bp, gross_cents, discount_cents, net_cents ]
      properties:
        id: { type: integer }
        position: { type: integer }
        product:
          type: object
          additionalProperties: false
          required: [ id, sku, name ]
          properties:
            id: { type: integer }
            sku: { type: string }
            name: { type: string }
        purchase_unit_code: { type: string }
        stock_unit_code: { type: string }
        factor:
          type: string
          pattern: '^[0-9]{1,9}\.[0-9]{6}$'
          description: Stock units per purchase unit, as copied from the product (ADR 0015).
        quantity:
          type: string
          pattern: '^[0-9]{1,12}\.[0-9]{3}$'
          description: In purchase units.
        received_quantity:
          type: string
          pattern: '^[0-9]{1,12}\.[0-9]{3}$'
        remaining_quantity:
          type: string
          pattern: '^[0-9]{1,12}\.[0-9]{3}$'
        unit_price_cents:
          type: integer
          description: Per purchase unit.
        discount_bp:
          type: integer
          description: Basis points, 0 to 10000.
        gross_cents: { type: integer }
        discount_cents: { type: integer }
        net_cents: { type: integer }

    PurchaseOrder:
      type: object
      additionalProperties: false
      required: [ id, number, status, supplier, installments, first_due_days, interval_days, note, total_cents, currency, revision, personal_data_visible, approved_at, cancelled_at, created_at, lines ]
      properties:
        id: { type: integer }
        number: { type: integer }
        status:
          $ref: "#/components/schemas/PurchaseOrderStatus"
        supplier:
          type: object
          additionalProperties: false
          required: [ id, name, document_type, document_number ]
          properties:
            id: { type: integer }
            name: { type: string }
            document_type:
              type: string
              enum: [ cpf, cnpj ]
            document_number:
              type: string
              description: Copied when the order was created; a CPF is masked when personal_data_visible is false (ADR 0014).
        installments: { type: integer }
        first_due_days: { type: integer }
        interval_days: { type: integer }
        note:
          type: string
          nullable: true
        total_cents:
          type: integer
          description: The sum of the lines' net amounts, stored.
        currency:
          type: string
          enum: [ BRL ]
        revision:
          type: integer
          description: Send it back when editing or approving a draft (ADR 0015).
        personal_data_visible: { type: boolean }
        approved_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOrderLine" }

    PurchaseOrderResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          $ref: "#/components/schemas/PurchaseOrder"

    PurchaseOrderListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOrderSummary" }
        meta:
          $ref: "#/components/schemas/Meta"

    PurchaseOrderLineInput:
      type: object
      additionalProperties: false
      required: [ product_id, quantity, unit_price_cents ]
      properties:
        product_id: { type: integer }
        quantity:
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,3})?$'
          description: In purchase units, at most 3 places.
        unit_price_cents:
          type: integer
          minimum: 0
          description: Per purchase unit.
        discount_bp:
          type: integer
          minimum: 0
          maximum: 10000
          description: Basis points off the line's gross; 0 when omitted.

    CreatePurchaseOrderRequest:
      type: object
      additionalProperties: false
      required: [ supplier_id, lines ]
      properties:
        supplier_id: { type: integer }
        installments:
          type: integer
          minimum: 1
          maximum: 24
          description: How many installments each receipt's payable is split in; 1 when omitted.
        first_due_days:
          type: integer
          minimum: 0
          maximum: 365
          description: Days from the receipt to the first due date; 30 when omitted.
        interval_days:
          type: integer
          minimum: 0
          maximum: 365
          description: Days between installments; 30 when omitted.
        note:
          type: string
          maxLength: 1000
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/PurchaseOrderLineInput" }

    UpdatePurchaseOrderRequest:
      type: object
      additionalProperties: false
      required: [ supplier_id, lines, revision ]
      properties:
        supplier_id: { type: integer }
        installments: { type: integer, minimum: 1, maximum: 24 }
        first_due_days: { type: integer, minimum: 0, maximum: 365 }
        interval_days: { type: integer, minimum: 0, maximum: 365 }
        note:
          type: string
          maxLength: 1000
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/PurchaseOrderLineInput" }
        revision:
          type: integer
          description: The revision that was read; a newer one answers 409 stale (ADR 0015).

    PurchaseOrderRevisionRequest:
      type: object
      additionalProperties: false
      required: [ revision ]
      properties:
        revision:
          type: integer
          description: The revision the approver saw; a newer one answers 409 stale (ADR 0015).

    PartnerSummary:
      type: object
      description: >
        A partner as listed (ADR 0014). The CPF is masked for every role and
        e-mail and phone are not part of a list; the full record comes from
        GET /partners/{id}.
      additionalProperties: false
      required: [ id, name, document_type, document_number, customer, supplier, active ]
      properties:
        id: { type: integer }
        name: { type: string }
        document_type:
          type: string
          enum: [ cpf, cnpj ]
        document_number:
          type: string
          description: >
            A CPF with only the middle six digits visible ("***982247**"); a
            CNPJ in full, since it is public registry data.
        customer: { type: boolean }
        supplier: { type: boolean }
        active: { type: boolean }

    Partner:
      type: object
      additionalProperties: false
      required: [ id, name, document_type, document_number, customer, supplier, email, phone, personal_data_visible, active, revision ]
      properties:
        id: { type: integer }
        name: { type: string }
        document_type:
          type: string
          enum: [ cpf, cnpj ]
        document_number:
          type: string
          description: >
            Digits only for a CPF; digits and upper-case letters for a CNPJ
            (ADR 0012, alphanumeric since July 2026). No punctuation. A CPF is
            masked as in PartnerSummary when personal_data_visible is false.
        customer: { type: boolean }
        supplier: { type: boolean }
        email:
          type: string
          nullable: true
          description: Always null when personal_data_visible is false.
        phone:
          type: string
          nullable: true
          description: Always null when personal_data_visible is false.
        personal_data_visible:
          type: boolean
          description: >
            False when the caller's role may not see this partner's CPF,
            e-mail and phone in full (ADR 0014: read_only).
        active: { type: boolean }
        revision:
          type: integer
          description: >
            Counts the successful edits of this record (ADR 0015). Send back
            the value that was read; if the record changed since, the answer
            is 409 stale and nothing is written.

    PartnerResponseBody:
      type: object
      additionalProperties: false
      required: [ data ]
      properties:
        data:
          $ref: "#/components/schemas/Partner"

    PartnerListResponseBody:
      type: object
      additionalProperties: false
      required: [ data, meta ]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/PartnerSummary" }
        meta:
          $ref: "#/components/schemas/Meta"

    CreatePartnerRequest:
      type: object
      additionalProperties: false
      required: [ name, document_type, document_number, customer, supplier ]
      properties:
        name: { type: string }
        document_type:
          type: string
          enum: [ cpf, cnpj ]
        document_number: { type: string }
        customer: { type: boolean }
        supplier: { type: boolean }
        email: { type: string }
        phone: { type: string }

    UpdatePartnerRequest:
      type: object
      additionalProperties: false
      required: [ name, document_type, document_number, customer, supplier, active, revision ]
      properties:
        name: { type: string }
        document_type:
          type: string
          enum: [ cpf, cnpj ]
        document_number: { type: string }
        customer: { type: boolean }
        supplier: { type: boolean }
        email: { type: string }
        phone: { type: string }
        active: { type: boolean }
        revision:
          type: integer
          description: The revision that was read; a newer one on the server answers 409 stale (ADR 0015).
