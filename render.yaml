services:
  - type: web
    name: alicerce
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SEED_USER_PASSWORD
        sync: false
      # Active Record Encryption (ADR 0012): pure random secrets, no
      # external registration needed, so Render can generate them the same
      # way it generates SECRET_KEY_BASE.
      - key: AR_ENCRYPTION_PRIMARY_KEY
        generateValue: true
      - key: AR_ENCRYPTION_DETERMINISTIC_KEY
        generateValue: true
      - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
        generateValue: true
      # Render injects WEB_CONCURRENCY=1, which forks a Puma worker and doubles memory on a 512 MB instance.
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
      - key: JOB_THREADS
        value: "1"
