name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: bin/ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bin/ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alicerce
          POSTGRES_PASSWORD: alicerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alicerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEMORY_BUDGET_MB: "450"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: alicerce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image with its default command, as Render runs it
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://alicerce:alicerce@127.0.0.1:5432/alicerce_production \
            -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            -e APP_HOST=127.0.0.1 \
            -e WEB_CONCURRENCY=0 -e RAILS_MAX_THREADS=3 -e SOLID_QUEUE_IN_PUMA=1 -e JOB_THREADS=1 \
            alicerce:ci
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:10000/up && exit 0; sleep 2; done
          exit 1
      - name: Check the shell, its headers and the static shell path
        run: |
          curl -sf -H "Accept: text/html" -D headers.txt -o /dev/null http://127.0.0.1:10000/estoque
          grep -qi "content-security-policy: default-src 'none'" headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/spa/index.html)" = 404
      - name: Check that Solid Queue runs inside Puma
        run: |
          sleep 10
          docker exec app bin/rails runner 'kinds = SolidQueue::Process.pluck(:kind); puts kinds.inspect; exit((%w[Worker Dispatcher Scheduler] - kinds).empty?)'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Browser smoke test under the production CSP
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Check memory against the free instance budget
        run: |
          usage=$(docker stats --no-stream --format '{{.MemUsage}}' app | cut -d/ -f1)
          echo "resident memory: $usage (budget ${MEMORY_BUDGET_MB} MB of 512 MB)"
          mb=$(echo "$usage" | awk '{ v = $1; if (v ~ /GiB/) { sub(/GiB/, "", v); print v * 1024 } else { sub(/MiB/, "", v); print v } }')
          awk -v mb="$mb" -v max="$MEMORY_BUDGET_MB" 'BEGIN { exit !(mb < max) }'
      - name: Application logs
        if: failure()
        run: docker logs app

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
