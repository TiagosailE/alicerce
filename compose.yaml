services:
  db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: alicerce
      POSTGRES_PASSWORD: alicerce
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alicerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
