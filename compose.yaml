services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: alicerce
      POSTGRES_PASSWORD: alicerce
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alicerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
