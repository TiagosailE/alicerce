services:
  db:
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_USER: alicerce
      POSTGRES_PASSWORD: alicerce
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alicerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
